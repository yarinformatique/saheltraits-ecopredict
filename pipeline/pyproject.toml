[tool.poetry]
name = "saheltraits-analytics-pipeline"
version = "1.0.0"
description = "Couche 4a : Chaîne bio-statistique et modélisation JSDM/CMIP6 reproductible pour les essences sahéliennes"
authors = ["YAGO Abdoul Rachide <rachide.yago@ujkz.bf>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0.0"
pandas = "^2.2.0"
scipy = "^1.14.0"
tifffile = ">=2024.5.22"
pillow = ">=10.3.0"
pyyaml = "^6.0.1"
requests = "^2.32.0"
httpx = ">=0.27.0"
pygbif = "^0.6.4"
xarray = ">=2024.6.0"
rasterio = ">=1.3.10"
rioxarray = ">=0.15.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
black = "^24.4.2"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
