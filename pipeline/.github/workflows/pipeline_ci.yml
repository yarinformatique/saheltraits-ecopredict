name: SahelTraits-DB & EcoPredict Couche 4a CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R 4.4
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev libproj-dev libudunits2-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install R Dependencies
        run: |
          Rscript -e "install.packages(c('ade4', 'ape', 'lme4', 'DHARMa', 'FactoMineR', 'factoextra', 'ggplot2', 'dplyr', 'tidyr', 'future'), repos='https://cloud.r-project.org/')"

      - name: Run Pipeline End-to-End
        run: |
          python run_pipeline.py --all

      - name: Run Automated Test Suite
        run: |
          python -m pytest tests/
