services:
  # 1. Backend REST API (SahelTraits-DB & EcoPredict)
  - type: web
    name: saheltraits-backend
    runtime: python
    buildCommand: "cd backend && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saheltraits-db
          property: connectionString

  # 2. Portail Web Décisionnel (EcoPredict Dashboard)
  - type: web
    name: ecopredict-web
    runtime: node
    buildCommand: "cd web && npm install && npm run build"
    startCommand: "cd web && npm run start -- -p $PORT"
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0

  # 3. Application Mobile Terrain (SahelField PWA)
  - type: web
    name: sahelfield-mobile
    runtime: node
    buildCommand: "cd mobile && npm install && npm run build"
    startCommand: "cd mobile && npm run start -- -p $PORT"
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0

databases:
  - name: saheltraits-db
    plan: free
    databaseName: saheltraits
    user: saheltraits_user
    postgresMajorVersion: 16
